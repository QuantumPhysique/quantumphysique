# The PR title becomes the squash commit that lands on dev, and that commit
# decides the version bump and its line in the release notes, so the title
# must be a conventional commit. PRs onto main (dev → main releases) land as
# merge commits whose message the release script ignores; no lint there.
name: PR title

on:
  pull_request:
    # `synchronize` keeps the required check attached to the newest head SHA
    types: [opened, edited, synchronize, reopened]
    branches: [dev]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
